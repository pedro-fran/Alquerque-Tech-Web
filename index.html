<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alquerque</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="Logo.png" alt="Alquerque logo">
        <h1>Alquerque</h1>
    </header>

    <main>
        <!-- Configurações -->
        <table>
            <tr>
                <td>
                    <select size="3" name="Tamanho_Tabuleiro">
                        <option>Small</option>
                        <option>Medium</option>
                        <option>Big</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <select size="2" name="Novo_Jogo">
                        <option>Computador</option>
                        <option>Outro Jogador</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <select size="2" name="Quem_joga">
                        <option>1</option>
                        <option>2</option>
                    </select>
                </td>
            </tr>
        </table>

        <!-- Difficulty Board -->
        <table>
            <tr>
                <td>
                    <select size="3" name="Dificuldade">
                        <option>easy</option>
                        <option>medium</option>
                        <option>hard</option>
                    </select>
                </td>
            </tr>
        </table>

        <!-- Score Board -->
        <table>
            <tr>
                <td>Player 1</td>
                <td>Player 2</td>
            </tr>
            <tr>
                <td>Score 1</td>
                <td>Score 2</td>
            </tr>
        </table>

        <!-- Tabuleiro -->
        <div class="board">
            <table>
                <tr>
                    <td>.</td>
                    <td>.</td>
                    <td>.</td>
                    <td>.</td>
                    <td>.</td>
                </tr>
                <tr>
                    <td>.</td>
                    <td>.</td>
                    <td>.</td>
                    <td>.</td>
                    <td>.</td>
                </tr>
                <tr>
                    <td>.</td>
                    <td>.</td>
                    <td>.</td>
                    <td>.</td>
                    <td>.</td>
                </tr>
                <tr>
                    <td>.</td>
                    <td>.</td>
                    <td>.</td>
                    <td>.</td>
                    <td>.</td>
                </tr>
                <tr>
                    <td>.</td>
                    <td>.</td>
                    <td>.</td>
                    <td>.</td>
                    <td>.</td>
                </tr>
            </table>
        </div>

        <!-- TEST: buttons -->
        <section>
            <button class="button">.button</button>
            <button class="btn">.btn</button>
            <button class="btn btn-primary">.btn-primary</button>
            <button class="btn btn-secondary">.btn-secondary</button>
            <button class="btn" disabled>.btn:disabled</button>
        </section>

        <!-- TEST: menu -->
        <nav class="menu">
            <h2 class="menu-title">.menu-title</h2>
            <ul class="menu-list">
                <li class="menu-item active">.menu-item.active</li>
                <li class="menu-item">.menu-item</li>
                <li class="menu-item">.menu-item</li>
            </ul>
            <div class="menu-options">
                <div class="menu-option">.menu-option</div>
                <div class="menu-option">.menu-option</div>
            </div>
        </nav>
    </main>

    <footer></footer>

    <script src="js/game.js"></script>
    <script src="js/mcts.js"></script>
    <script src="js/player.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
